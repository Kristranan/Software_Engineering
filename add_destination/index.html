<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story 002-1: Assign Destination</title>
    <!-- Leaflet CSS for interactive map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
        }

        .map-section {
            flex: 1;
            min-width: 300px;
            height: 380px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        h2 { margin-top: 0; color: #333; }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input:disabled { background-color: #f0f0f0; }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover { background-color: #0056b3; }

        #result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-weight: bold;
        }

        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <!-- Form Panel -->
    <div class="form-section">
        <h2>Assign Destination (Story 002-1)</h2>
        
        <label>Shipment ID:</label>
        <input type="text" id="shipmentId" value="SHP-1001" disabled />

        <label for="clinicSelect">Select Destination Clinic:</label>
        <select id="clinicSelect" onchange="onClinicChange()">
            <option value="">-- Loading Clinics... --</option>
        </select>

        <button onclick="assignDestination()">Assign Destination</button>

        <div id="result"></div>
    </div>

    <!-- Interactive Map Panel -->
    <div class="map-section">
        <div id="map"></div>
    </div>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    let markers = {};

    // Clinic Coordinates (Salaya / Nakhon Pathom area)
    const clinicLocations = {
        'CLK-001': { lat: 13.8016, lng: 100.3228, name: 'Salaya Health Center' },
        'CLK-002': { lat: 14.0227, lng: 100.1882, name: 'Nakhon Pathom Rural Clinic' },
        'CLK-003': { lat: 13.8196, lng: 100.0443, name: 'Unregistered Test Site' }
    };

    // Initialize Map centered on Nakhon Pathom
    function initMap() {
        map = L.map('map').setView([13.8196, 100.15], 10);

        // OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Add pins for each clinic location
        Object.keys(clinicLocations).forEach(id => {
            const loc = clinicLocations[id];
            const marker = L.marker([loc.lat, loc.lng]).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b><br>ID: ${id}`);
            
            // Clicking pin auto-selects clinic in dropdown
            marker.on('click', () => {
                document.getElementById('clinicSelect').value = id;
            });

            markers[id] = marker;
        });
    }

    // Load registered clinics into dropdown
    async function loadClinics() {
        try {
            const res = await fetch('http://localhost:3000/api/clinics/registered');
            const clinics = await res.json();
            
            const select = document.getElementById('clinicSelect');
            select.innerHTML = '<option value="">-- Choose a Registered Clinic --</option>';
            
            clinics.forEach(c => {
                select.innerHTML += `<option value="${c.clinic_id}">${c.clinic_name} (${c.district})</option>`;
            });

            // Add unregistered test site option to verify error handling
            select.innerHTML += `<option value="CLK-003">⚠️ Unregistered Test Site (Should Fail)</option>`;
        } catch (err) {
            alert('Make sure backend.js is running!');
        }
    }

    // Zoom to pin when dropdown selection changes
    function onClinicChange() {
        const id = document.getElementById('clinicSelect').value;
        if (id && clinicLocations[id]) {
            const loc = clinicLocations[id];
            map.flyTo([loc.lat, loc.lng], 13);
            markers[id].openPopup();
        }
    }

    // Submit destination assignment
    async function assignDestination() {
        const shipmentId = document.getElementById('shipmentId').value;
        const clinicId = document.getElementById('clinicSelect').value;
        const resultDiv = document.getElementById('result');

        if (!clinicId) {
            alert('Please select a clinic first!');
            return;
        }

        try {
            const res = await fetch('http://localhost:3000/api/shipments/assign-destination', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ shipment_id: shipmentId, destination_clinic_id: clinicId })
            });

            const data = await res.json();
            resultDiv.style.display = 'block';

            if (res.ok) {
                resultDiv.className = 'success';
                resultDiv.innerText = `✅ ${data.message} (Status: ${data.shipment.status})`;
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = `❌ ${data.error}`;
            }
        } catch (err) {
            alert('Failed to connect to backend.');
        }
    }

    initMap();
    loadClinics();
</script>

</body>
</html>
